[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-recorder-pyqt"
version = "1.0.8"
description = "A high-performance screen recording application with PyQt6"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Screen Recorder Team", email = "noreply@github.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video :: Capture",
]
keywords = ["screen", "recorder", "capture", "video", "pyqt6", "qt"]

dependencies = [
    # GUI Framework
    "PyQt6>=6.5.0",
    
    # Screen Capture
    "mss>=9.0.0",
    "dxcam>=0.0.5; sys_platform == 'win32'",
    
    # Video Encoding
    "av>=10.0.0",
    "numpy>=1.24.0",
    
    # Audio Capture
    "sounddevice>=0.4.6",
    "pyaudiowpatch>=0.2.12",
    
    # Utilities
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.0.0",
    
    # Code Quality
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "flake8>=6.0.0",
    
    # Build
    "pyinstaller>=6.0.0",
    "build>=1.0.0",
]

[project.scripts]
screen-recorder = "screen_recorder.app:main"

[project.gui-scripts]
screen-recorder-gui = "screen_recorder.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
screen_recorder = ["resources/**/*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["mss.*", "av.*", "sounddevice.*", "pyaudiowpatch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=screen_recorder --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyqt6"

[tool.coverage.run]
source = ["src/screen_recorder"]
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]